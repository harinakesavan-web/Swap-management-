<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Delete Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            height: 100vh;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="card p-4 shadow-lg" style="width: 350px;">
    <h3 class="text-center mb-3">🗑 Delete Employee</h3>

    <input type="text" id="empId" class="form-control mb-3" placeholder="Employee ID">

    <button class="btn btn-danger w-100" onclick="deleteEmployee()">Delete</button>

    <br><br>
    <button onclick="goHome()">Go to Home</button>

    <br><br>
    <button onclick="logout()">Logout</button>

    <p id="message" class="mt-3 text-center"></p>
</div>

<script>
    function deleteEmployee() {
        var empId = document.getElementById("empId").value.trim();

        if (empId === "") {
            document.getElementById("message").style.color = "red";
            document.getElementById("message").innerText = "Employee-id is Mandatory";
            return;
        }

        fetch("/employees/delete/" + empId, { method: "DELETE" })
            .then(r => { if (!r.ok) throw new Error("Error while deleting"); return r.text(); })
            .then(data => {
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText = data;
                document.getElementById("empId").value = "";
            })
            .catch(e => {
                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerText = e.message;
            });
    }
</script>

<script>
    function goHome() {
        window.location.href = "/home.html";
    }
</script>

<script>
    function logout() {
        fetch("/logout", {
            method: "POST"
        })
            .then(() => {
                window.location.href = "/login.html";
            })
            .catch(error => console.error(error));
    }
</script>

</body>
</html>
