<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            height: 100vh;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="card p-4 shadow-lg" style="width: 350px;">
    <h3 class="text-center mb-3">➕ Add Employee</h3>

    <input type="text" id="empId" class="form-control mb-3" placeholder="Employee ID">
    <input type="text" id="name" class="form-control mb-3" placeholder="Employee Name">

    <button class="btn btn-primary w-100" onclick="addEmployee()">Add</button>

    <br><br>
    <button onclick="goHome()">Go to Home</button>

    <br><br>
    <button onclick="logout()">Logout</button>

    <p id="message" class="mt-3 text-center"></p>
</div>

<script>
    function addEmployee() {
        var empId = document.getElementById("empId").value.trim();
        var name = document.getElementById("name").value.trim();

        if (empId === "" || name === "") {
            document.getElementById("message").style.color = "red";
            document.getElementById("message").innerText =
                "Employee-id/Employee-name are Mandatory";
            return;
        }

        fetch("/employees/add", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ empId: empId, empName: name })
        })
            .then(r => { if (!r.ok) throw new Error("Error while adding"); return r.text(); })
            .then(data => {
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText = data;
                empId = name = "";
                document.getElementById("empId").value = "";
                document.getElementById("name").value = "";
            })
            .catch(e => {
                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerText = e.message;
            });
    }
</script>

<script>
    function goHome() {
        window.location.href = "/home.html";
    }
</script>

<script>
    function logout() {
        fetch("/logout", {
            method: "POST"
        })
            .then(() => {
                window.location.href = "/login.html";
            })
            .catch(error => console.error(error));
    }
</script>

</body>
</html>
