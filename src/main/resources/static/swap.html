<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Delete Swap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f7971e, #ffd200);
            height: 100vh;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="card p-4 shadow-lg" style="width: 350px;">
    <h3 class="text-center mb-3">🔄 Delete Swap</h3>

    <input type="text" id="empId" class="form-control mb-3" placeholder="Employee ID">
    <input type="date" id="date" class="form-control mb-3">
    <input type="password" id="password" class="form-control mb-3" placeholder="Re-enter Password">

    <button class="btn btn-warning w-100" onclick="deleteSwap()">Delete</button>

    <br><br>
    <button onclick="goHome()">Go to Home</button>

    <br><br>
    <button onclick="logout()">Logout</button>

    <p id="message" class="mt-3 text-center"></p>
</div>

<script>
    function deleteSwap() {
        var empId = document.getElementById("empId").value.trim();
        var date = document.getElementById("date").value;
        var password = document.getElementById("password").value;

        if (empId === "" || date === "") {
            document.getElementById("message").style.color = "red";
            document.getElementById("message").innerText =
                "Employee-id/Date are Mandatory";
            return;
        }

        fetch("/employees/swap/delete", {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                empId: empId,
                date: date,
                password: password
            })
        })
            .then(r => { if (!r.ok) throw new Error("Error while deleting swap"); return r.text(); })
            .then(data => {
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText = data;
                document.getElementById("empId").value = "";
                document.getElementById("date").value = "";
                document.getElementById("password").value = "";
            })
            .catch(e => {
                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerText = e.message;
            });
    }
</script>

<script>
    function goHome() {
        window.location.href = "/home.html";
    }
</script>

<script>
    function logout() {
        fetch("/logout", {
            method: "POST"
        })
            .then(() => {
                window.location.href = "/login.html";
            })
            .catch(error => console.error(error));
    }
</script>

</body>
</html>
