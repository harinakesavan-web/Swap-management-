<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Swap Management Dashboard</title>

    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
        }

        .card {
            border-radius: 20px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="container text-center">

    <h1 class="text-white mb-5">👨‍💼 Swap Management Dashboard</h1>

    <div class="row justify-content-center">

        <!-- Add Employee -->
        <div class="col-md-3">
            <div class="card p-4 shadow">
                <h4>➕ Add Employee</h4>
                <p>Add new employee details</p>
                <button class="btn btn-primary" onclick="goToAdd()">Go</button>
            </div>
        </div>

        <!-- Delete Employee -->
        <div class="col-md-3">
            <div class="card p-4 shadow">
                <h4>🗑 Delete Employee</h4>
                <p>Remove employee from system</p>
                <button class="btn btn-danger" onclick="goToDelete()">Go</button>
            </div>
        </div>

        <!-- Swap Delete -->
        <div class="col-md-3">
            <div class="card p-4 shadow">
                <h4>🔄 Delete Swap</h4>
                <p>Delete swap request</p>
                <button class="btn btn-warning" onclick="goToSwap()">Go</button>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <button class="btn btn-dark" onclick="logout()">Logout</button>
    </div>

</div>

<script>
    function goToAdd() {
        window.location.href = "/add.html";
    }

    function goToDelete() {
        window.location.href = "/delete.html";
    }

    function goToSwap() {
        window.location.href = "/swap.html";
    }
</script>

<script>
    function logout() {
        fetch("/logout", {
            method: "POST"
        })
            .then(() => {
                window.location.href = "/login.html";
            })
            .catch(error => console.error(error));
    }
</script>

</body>
</html>
