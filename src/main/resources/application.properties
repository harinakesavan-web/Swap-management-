# ===============================
# Azure PostgreSQL DB Configuration
# ===============================

#spring.datasource.url=jdbc:postgresql://kesavan-pg.postgres.database.azure.com:5432/springboot_db?sslmode=require
#spring.datasource.username=pgadmin
#spring.datasource.password=Kanima17@
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.show-actuator=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.servlet.session.timeout=5m
